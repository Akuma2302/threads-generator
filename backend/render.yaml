services:
  - type: web
    name: threads-generator-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_FALLBACK_MODELS
        value: meta-llama/llama-3.3-70b-instruct:free,z-ai/glm-4.5-air:free,nvidia/nemotron-3-super-120b-a12b:free
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_APP_NAME
        value: Threads Generator
      - key: CLIENT_ORIGIN
        sync: false
      - key: RATE_LIMIT_MAX
        value: 30
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
